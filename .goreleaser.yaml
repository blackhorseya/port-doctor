version: 2

project_name: port-doctor

builds:
  - id: port-doctor
    main: ./cmd/port-doctor
    binary: port-doctor
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  # Release notes come from GitHub's own generator, one line per merged PR.
  # The git-based changelog listed every change twice because main only
  # receives merge commits: once for the branch commit, once for the merge.
  use: github-native
